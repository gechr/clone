name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions: {}

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    # @clover
    uses: gechr/actions/.github/workflows/release.yaml@68bad8ed683a148c69d6ae944f128b77e1a6a9db # v0.2.13
    secrets:
      RELEASER_APP_PRIVATE_KEY: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
    with:
      language: go
      name: clone
      desc: "Clone GitHub repositories in parallel"
