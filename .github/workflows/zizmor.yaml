name: zizmor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    permissions:
      contents: read
      actions: read
      security-events: write
    # @clover
    uses: gechr/actions/.github/workflows/zizmor.yaml@68bad8ed683a148c69d6ae944f128b77e1a6a9db # v0.2.13
    with:
      advanced-security: "true"
