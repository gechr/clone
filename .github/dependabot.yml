version: 2

updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: gechr/actions

  - package-ecosystem: gomod
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"
